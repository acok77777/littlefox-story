<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9cfe0">
  <title>리틀팍스 동화 1편</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="backButton" class="icon-button hidden" aria-label="뒤로 가기">‹</button>
    <div class="brand">
      <span class="brand-mascot" aria-hidden="true">🐰</span>
      <h1 id="pageTitle">리틀팍스 동화 1편</h1>
      <span class="brand-sparkle" aria-hidden="true">✦</span>
    </div>
    <button id="closeButton" class="icon-button hidden" aria-label="나가기">×</button>
  </header>

  <main class="app">
    <section id="homeScreen" class="screen">
      <div class="hero-card">
        <div class="hero-copy">
          <p class="tiny-label">LITTLE FOX STORY TIME</p>
          <h2>오늘도 영어랑<br>친해져 볼까요? <span>♡</span></h2>
          <p>동화를 하나씩 읽고, 듣고, 체크해 봐요!</p>
        </div>
        <div class="hero-characters" aria-label="토끼와 곰 캐릭터">🐰 🐻</div>
        <span class="deco deco-star">✦</span><span class="deco deco-heart">♡</span>
      </div>
      <div class="section-title"><span>🌷</span><h2>공부할 동화 고르기</h2><span>🌷</span></div>
      <div class="range-grid" id="rangeGrid"></div>
      <div class="friendly-tip">🐣 천천히 해도 괜찮아요. 매일 조금씩!</div>
    </section>

    <section id="listScreen" class="screen hidden">
      <div class="section-title left"><span>📚</span><h2>동화 목록</h2></div>
      <p class="section-description" id="listDescription"></p>
      <div id="storyList" class="story-list"></div>
      <div class="friendly-tip">🧸 공부를 마친 편은 체크해 두세요!</div>
    </section>

    <section id="studyScreen" class="screen hidden">
      <div class="study-heading">
        <div class="study-title-wrap">
          <span class="mini-mascot">🐻</span>
          <div>
            <p class="eyebrow" id="studyEpisode">1편</p>
            <h2 id="studyTitle">I See</h2>
          </div>
        </div>
        <button id="audioButton" class="audio-button" type="button">
          <span aria-hidden="true">🔊</span><span>영어 듣기</span>
        </button>
      </div>

      <div class="mode-tabs" role="group" aria-label="표시할 내용">
        <button class="mode-button active" data-mode="both"><span>🌈</span> 모두</button>
        <button class="mode-button" data-mode="english"><span>🔤</span> 영어만</button>
        <button class="mode-button" data-mode="korean"><span>💗</span> 해석만</button>
      </div>

      <article id="storyContent" class="story-content"></article>

      <div class="completion-card">
        <div class="completion-copy">
          <span class="completion-mascot">🐥</span>
          <div><strong>오늘 공부 완료했나요?</strong><p>체크를 직접 켜고 끌 수 있어요.</p></div>
        </div>
        <label class="done-toggle">
          <input type="checkbox" id="doneCheckbox">
          <span class="custom-check" aria-hidden="true">✓</span>
          <span id="doneLabel">완료 전</span>
        </label>
        <button id="saveButton" class="save-button" type="button">💾 저장하기</button>
        <p id="saveMessage" class="save-message" aria-live="polite">체크한 뒤 저장하기를 눌러 주세요.</p>
      </div>
      <p class="small-note">※ 저장한 체크는 이 기기의 브라우저에 보관됩니다.</p>
    </section>
  </main>

  <footer class="footer">made with ♡ for little learners</footer>
  <audio id="storyAudio" preload="none"></audio>
  <script src="script.js"></script>
</body>
</html>
